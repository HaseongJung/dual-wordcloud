[project]
name = "dual-wordcloud"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "wordcloud>=1.9.0",
    "matplotlib>=3.8.0",
    "matplotlib-venn>=0.11.0",
    "shapely>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_wordcloud"]
